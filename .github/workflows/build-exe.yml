name: Build exe

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Build GUI and CLI executables
        run: python packaging/build.py
      - name: Smoke test the CLI exe
        shell: pwsh
        run: |
          .\dist\AccountRecordCleaner-cli.exe --version
          .\dist\AccountRecordCleaner-cli.exe --dry-run
          if ($LASTEXITCODE -ne 0) { throw "dry-run exited $LASTEXITCODE" }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AccountRecordCleaner-windows
          path: |
            dist/AccountRecordCleaner.exe
            dist/AccountRecordCleaner-cli.exe
            dist/SHA256SUMS.txt
